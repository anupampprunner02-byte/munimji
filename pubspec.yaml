name: munimji
description: GST-compliant business accounting app for Indian SMBs
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.9

  # Navigation
  go_router: ^13.1.0

  # Networking
  dio: ^5.4.0

  # Secure Storage
  flutter_secure_storage: ^9.0.0

  # PDF Generation
  pdf: ^3.10.8
  printing: ^5.12.0

  # UI Components
  fl_chart: ^0.67.0
  intl: ^0.19.0
  pin_code_fields: ^8.0.1

  # Utils
  path_provider: ^2.1.2
  share_plus: ^7.2.2
  url_launcher: ^6.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/lottie/
