name: Build MunimJi APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:   # allows manual trigger from GitHub UI

jobs:
  build-apk:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze --no-fatal-infos || true

      - name: Build release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Rename APK
        run: mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/munimji-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: munimji-apk
          path: build/app/outputs/flutter-apk/munimji-release.apk
          retention-days: 30

      - name: Show APK info
        run: |
          ls -lh build/app/outputs/flutter-apk/
          echo "APK built successfully! Download from Actions > Artifacts section."
